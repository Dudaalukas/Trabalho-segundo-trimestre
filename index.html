<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

</head>

<body>
    <header>
        <h1>BLOG DO PLANETA</h1>
        <p>TOUR PELO MUNDO.</p>
        <style>
            header {
                background-color: #6d0909;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }

            main {
                background-color: #FFFFFF;
                color: #182963;

            }

            article {
                display: flex;
            }

            img {
                width: 80px;
                height: 80px;
            }

            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </header>

    <main>
        <article>
            <img src="imagem-blog.png"
                alt="Logotipo conceitual de tecnologia e educacao: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">

            <div>
                <h2>POLEMICAS NA COPA DO MUNDO!</h2>
                <p class="artigo-autor">Por: Nathalia</p>
                <p>Portugal vence a copa, e o robozão encerra a sua carreira do melhor jeito possível!</p>
                <button>❤️<span>0</span></button>
                <button>🤖.<span>0</span></button>
            </div>
        </article>
        <article>
            <img src="imagem-blog.png"
                alt="Logotipo conceitual de tecnologia e educacao: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">

            <div>
                <h2>Neymar encerra sua carreia após lesão na copa do mundo.</h2>
                <p class="artigo-autor">Por: Nathalia</p>
                <p>Tudo ocorreu como esperavamos.</p>
                <button>❤️<span>0</span></button>
                <button>👍<span>0</span></button>
            </div>
        </article>

    </main>
</body>

<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    });



</script>

</html>
